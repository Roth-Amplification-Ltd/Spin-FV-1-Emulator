name: Native Windows Frontend

on:
  push:
  pull_request:

jobs:
  win32-msvc:
    strategy:
      fail-fast: false
      matrix:
        shared: [ON, OFF]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Configure native Windows frontend
        shell: pwsh
        run: >-
          cmake -S . -B build-win32
          -DFV1_BUILD_TESTS=ON
          -DFV1_BUILD_GUI=OFF
          -DFV1_ENABLE_LIVE_AUDIO=OFF
          -DFV1_BUILD_WINDOWS_FRONTEND=ON
          -DFV1_SDK_BUILD_SHARED=${{ matrix.shared }}
      - name: Build Windows product and SDK-boundary tests
        run: >-
          cmake --build build-win32 --config RelWithDebInfo --parallel 2
          --target fv1-lab-win32
          fv1-native-frontend-session-tests
          fv1-native-frontend-realtime-tests
      - name: Run Windows frontend acceptance tests
        shell: pwsh
        run: |
          ctest --test-dir build-win32 -C RelWithDebInfo --output-on-failure -R "^(fv1-native-frontend-session-tests|fv1-native-frontend-realtime-tests|phase7-windows-frontend-boundary)$"
      - name: Stage Windows product
        run: cmake --install build-win32 --config RelWithDebInfo --prefix stage-win32
      - name: Verify staged executable
        shell: pwsh
        run: |
          if (!(Test-Path stage-win32/bin/fv1-lab-win32.exe)) { throw 'fv1-lab-win32.exe missing from staged product' }
          if ('${{ matrix.shared }}' -eq 'ON' -and !(Test-Path stage-win32/bin/fv1-sdk.dll)) { throw 'shared fv1-sdk.dll missing from staged product' }
